services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutri
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/pg-init:/docker-entrypoint-initdb.d

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      - db
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ["pnpm", "dev"]

volumes:
  pgdata:
